server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for x402 simulator & Facilitator relay
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Pass transparent payment headers
        proxy_pass_header PAYMENT-REQUIRED;
        proxy_pass_header PAYMENT-SIGNATURE;
        proxy_pass_header PAYMENT-RESPONSE;
    }
}

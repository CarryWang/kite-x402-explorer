name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build production image
        run: docker build -t kite-explorer:test .
      - name: Start production image without external network access
        run: docker run --detach --network none --name kite-explorer-smoke kite-explorer:test
      - name: Verify production API and SPA
        run: docker exec -i kite-explorer-smoke node --input-type=module < scripts/smoke-production.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker logs kite-explorer-smoke
      - name: Remove smoke container
        if: always()
        run: docker rm -f kite-explorer-smoke
